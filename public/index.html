<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NO TOCAR — La despedida</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .contenedor {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .titulo {
    margin-bottom: 28px;
}

.titulo h1 {
    margin: 0;
    font-size: clamp(30px, 8vw, 42px);
    letter-spacing: 5px;
    font-weight: bold;
}

.titulo p {
    margin: 6px 0 0;
    font-size: clamp(15px, 4vw, 19px);
    color: #aaa;
    letter-spacing: 2px;
}

        .opciones {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

        .boton {
    width: 100%;
    height: 115px;

    text-decoration: none;
    color: white;

    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 16px;

    padding: 15px 22px;

    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;

    transition: 0.2s;

    
 -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;    
}

.texto-boton {
    flex: 1;
    text-align: left;
}

.boton:hover {
    background: #242424;
    border-color: #666;
    transform: translateY(-2px);
}


        .icono {
    width: 75px;
    height: 75px;

    flex-shrink: 0;
    margin: 0 25px 0 5px;
}

        .boton h2 {
    margin: 0;
    font-size: clamp(16px, 4vw, 20px);
}

.boton p {
    margin: 5px 0 0;
    color: #999;
    font-size: clamp(11px, 3vw, 14px);
}


        /* ICONO ESCANER */

        .icono-scanner {
            position: relative;
            width: 105px;
            height: 105px;
        }

        .marco {
            position: absolute;
            inset: 10px;

            border: 4px solid white;
            border-radius: 5px;
        }

        .esquina {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: white;
            border-style: solid;
        }

        .esquina.arriba-izq {
            top: 0;
            left: 0;
            border-width: 5px 0 0 5px;
        }

        .esquina.arriba-der {
            top: 0;
            right: 0;
            border-width: 5px 5px 0 0;
        }

        .esquina.abajo-izq {
            bottom: 0;
            left: 0;
            border-width: 0 0 5px 5px;
        }

        .esquina.abajo-der {
            bottom: 0;
            right: 0;
            border-width: 0 5px 5px 0;
        }

        .linea {
            position: absolute;
            left: 15px;
            right: 15px;
            top: 50%;

            height: 3px;
            background: white;
        }


        /* ICONO PANEL */

        .icono-panel {
    width: 75px;
    height: 75px;

    flex-shrink: 0;

    background: #222;
    border: 3px solid #aaa;
    border-radius: 10px;

    padding: 11px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

        .fila {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 4px 0;
}

.punto {
    width: 6px;
    height: 6px;
    flex-shrink: 0;

    border-radius: 50%;
    background: #aaa;
}

.linea-panel {
    height: 4px;
    flex: 1;

    background: #aaa;
    border-radius: 4px;
}


        @media (max-width: 600px) {
        .icono-panel {
        width: 62px;
        height: 62px;
        padding: 9px;
        border-width: 2px;
    }

    .icono-panel .fila {
        gap: 5px;
        margin: 3px 0;
    }

    .icono-panel .punto {
        width: 5px;
        height: 5px;
    }

    .icono-panel .linea-panel {
        height: 3px;
    }

    body {
        padding: 18px 12px;
    }

    .contenedor {
        width: min(100%, 420px);
    }

    .titulo {
        margin-bottom: 24px;
    }

    .titulo h1 {
        letter-spacing: 4px;
    }

    .opciones {
        gap: 10px;
    }

    .boton {
        height: 100px;
        padding: 12px 15px;
        border-radius: 13px;
    }

    .icono {
        width: 62px;
        height: 62px;
        margin-right: 18px;
        margin-left: 2px;
    }

    .boton h2 {
        font-size: 16px;
    }

    .boton p {
        font-size: 11px;
    }
}

    </style>
</head>

<body>

    <div class="contenedor">

        <div class="titulo">
            <h1>NO TOCAR</h1>
            <p>LA DESPEDIDA</p>
        </div>


        <div class="opciones">


            <!-- ESCANEAR QR -->

            <a href="/scanner" class="boton">

                <div class="icono icono-scanner">

                    <div class="marco"></div>

                    <div class="esquina arriba-izq"></div>
                    <div class="esquina arriba-der"></div>
                    <div class="esquina abajo-izq"></div>
                    <div class="esquina abajo-der"></div>

                    <div class="linea"></div>

                </div>

                <div class="texto-boton">
    <h2>ESCANEAR QR</h2>
    <p>Validar una entrada</p>
</div>

            </a>


            <!-- PANEL -->

            <a href="/admin" class="boton">

                <div class="icono icono-panel">

                    <div class="fila">
                        <div class="punto"></div>
                        <div class="linea-panel"></div>
                    </div>

                    <div class="fila">
                        <div class="punto"></div>
                        <div class="linea-panel"></div>
                    </div>

                    <div class="fila">
                        <div class="punto"></div>
                        <div class="linea-panel"></div>
                    </div>

                    <div class="fila">
                        <div class="punto"></div>
                        <div class="linea-panel"></div>
                    </div>

                </div>

                <div class="texto-boton">
    <h2>PANEL DE CONTROL</h2>
    <p>Ver entradas escaneadas</p>
</div>

            </a>


        </div>

    </div>

</body>
</html>
